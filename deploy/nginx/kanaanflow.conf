# KanaanFlow PWA on the Raspberry Pi.
# Installed by .github/workflows/deploy-to-pi.yml to /etc/nginx/conf.d/kanaanflow.conf.
# Listens on localhost only: the Cloudflare Tunnel is the one way in (https://<your-host> -> http://localhost:18081).

server {
    listen 127.0.0.1:18081;
    server_name _;

    root /var/www/kanaanflow;
    index index.html;

    # Use the pre-compressed .gz files from dotnet publish.
    gzip_static on;

    # Phones must always check for a new version of the app shell; the service worker handles offline caching.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fonts and icons rarely change.
    location ~* \.(woff2|png)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # App routes such as /people/123 are handled in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
