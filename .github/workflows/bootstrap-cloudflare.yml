# One-off first deploy to Cloudflare. Gets a short-lived deploy token by proving (GitHub OIDC) that it runs in this
# repo on this branch. Removed after the first deploy; later deploys use deploy-cloudflare.yml.
name: Bootstrap Cloudflare deploy
on:
  push:
    branches: ["claude/cloudflare-deploy"]
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: 68c8837facf88fb3fddb3a4ccfc35c6c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the app
        run: |
          dotnet publish KanaanFlow.Web/KanaanFlow.Web.csproj -c Release -o out
          rm -rf KanaanFlow.Cloudflare/public
          cp -r out/wwwroot KanaanFlow.Cloudflare/public
          find KanaanFlow.Cloudflare/public -type f \( -name '*.br' -o -name '*.gz' \) -delete
          cp KanaanFlow.Cloudflare/_headers KanaanFlow.Cloudflare/public/_headers
          ls KanaanFlow.Cloudflare/public | head -30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get a deploy token
        run: |
          ID_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kanaanflow-deploy" | jq -r .value)
          CF_TOKEN=$(curl -fsS -X POST -H "Authorization: Bearer $ID_TOKEN" https://ci-token.kanaan-tricot.com/)
          echo "::add-mask::$CF_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
      - name: Deploy
        working-directory: KanaanFlow.Cloudflare
        run: |
          npm ci
          npx wrangler d1 migrations apply kanaanflow --remote
          npx wrangler deploy
