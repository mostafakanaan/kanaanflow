name: deploy-pwa

# Publishes the KanaanFlow PWA to GitHub Pages.
# Enable it once under Settings > Pages > Source: "GitHub Actions", then run this workflow by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish KanaanFlow.Web/KanaanFlow.Web.csproj -c Release -o out

      - name: Prepare for a project subfolder
        shell: bash
        run: |
          set -euo pipefail
          site=out/wwwroot
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"${base}\" />|" "$site/index.html"
          rm -f "$site/index.html.gz" "$site/index.html.br"
          # The offline cache checks each file's hash, so record the edited index.html's new hash.
          python3 - "$site" <<'PY'
          import base64, hashlib, json, re, sys
          site = sys.argv[1]
          digest = base64.b64encode(hashlib.sha256(open(f"{site}/index.html", "rb").read()).digest()).decode()
          path = f"{site}/service-worker-assets.js"
          text = open(path, encoding="utf-8").read()
          data = json.loads(re.search(r"=\s*(\{.*\});?\s*$", text, re.S).group(1))
          for asset in data["assets"]:
              if asset["url"] == "index.html":
                  asset["hash"] = "sha256-" + digest
          open(path, "w", encoding="utf-8").write("self.assetsManifest = " + json.dumps(data, indent=2) + ";\n")
          PY
          rm -f "$site/service-worker-assets.js.gz" "$site/service-worker-assets.js.br"
          # Deep links: GitHub Pages serves 404.html for unknown paths, so let it boot the app too.
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
