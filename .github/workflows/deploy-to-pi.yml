name: Build & Deploy (Self-hosted Pi)

# Builds the KanaanFlow PWA on the Raspberry Pi and serves it with nginx; the Cloudflare Tunnel publishes it.
# One-time Pi setup: docs/hosting-pi.md

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-kanaanflow
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          # The default (/usr/share/dotnet) isn't writable by the runner user; keep .NET in the runner's tool cache.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test KanaanFlow.Tests/KanaanFlow.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish KanaanFlow.Web/KanaanFlow.Web.csproj -c Release -o out

      - name: Deploy to web root
        env:
          PI_TARGET_DIR: /var/www/kanaanflow
        run: |
          sudo mkdir -p "${PI_TARGET_DIR}"
          # Readable by nginx whatever the runner user's umask is.
          sudo rsync -a --delete --timeout=30 --chmod=D755,F644 ./out/wwwroot/. "${PI_TARGET_DIR}/"

      - name: Install nginx site
        run: sudo install -m 644 deploy/nginx/kanaanflow.conf /etc/nginx/conf.d/kanaanflow.conf

      - name: Check the port is free for nginx
        # Port 8081 was taken by another service on this Pi (llama-server); fail clearly if 18081 ever is too.
        run: |
          holder="$(sudo ss -ltnpH 'sport = :18081' | grep -v nginx || true)"
          if [ -n "$holder" ]; then
            echo "::error::Port 18081 is used by another program, so nginx can't serve KanaanFlow on it: $holder"
            exit 1
          fi

      - name: Reload Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Smoke test
        run: |
          # nginx reloads in the background, so give it a few seconds.
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null http://127.0.0.1:18081/ \
              && curl -fsS -o /dev/null http://127.0.0.1:18081/people \
              && curl -fsS -o /dev/null http://127.0.0.1:18081/service-worker.js; then
              echo "KanaanFlow is served on 127.0.0.1:18081"
              exit 0
            fi
            sleep 1
          done
          echo "::group::Diagnostics"
          curl -sS -i http://127.0.0.1:18081/ | head -15 || true
          echo "--- listening on 18081:"; sudo ss -ltnp | grep ':18081' || echo "nothing"
          echo "--- nginx includes:"; grep -n "include" /etc/nginx/nginx.conf || true
          echo "--- web root:"; sudo ls -la /var/www/kanaanflow | head -8
          echo "--- nginx error log:"; sudo tail -n 20 /var/log/nginx/error.log || true
          echo "::endgroup::"
          exit 1
