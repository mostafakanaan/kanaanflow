name: Build & Deploy (Self-hosted Pi)

# Builds KanaanFlow on the Raspberry Pi: the PWA is served by nginx, the sync service and Postgres run in Docker,
# and the Cloudflare Tunnel publishes both. One-time Pi setup: docs/hosting-pi.md

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-kanaanflow
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          # The default (/usr/share/dotnet) isn't writable by the runner user; keep .NET in the runner's tool cache.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test KanaanFlow.Tests/KanaanFlow.Tests.csproj -c Release

      - name: Publish
        run: |
          dotnet publish KanaanFlow.Web/KanaanFlow.Web.csproj -c Release -o out
          dotnet publish KanaanFlow.Sync/KanaanFlow.Sync.csproj -c Release -o deploy/sync/app

      - name: Ensure Docker
        run: |
          if ! command -v docker >/dev/null; then
            echo "Installing Docker (first deploy only)"
            curl -fsSL https://get.docker.com | sudo sh
          fi
          sudo docker version --format 'Docker {{.Server.Version}}'

      - name: Ensure database password
        # Generated once on the Pi and never leaves it.
        run: |
          if ! sudo test -f /etc/kanaanflow/db.env; then
            sudo mkdir -p /etc/kanaanflow
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" | sudo tee /etc/kanaanflow/db.env > /dev/null
            sudo chmod 600 /etc/kanaanflow/db.env
            echo "Created /etc/kanaanflow/db.env"
          fi

      - name: Start sync service and database
        run: |
          sudo docker compose -f deploy/docker-compose.yml --env-file /etc/kanaanflow/db.env up -d --build --remove-orphans
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8082/api/health; then echo "Sync service is up"; exit 0; fi
            sleep 2
          done
          sudo docker compose -f deploy/docker-compose.yml logs --tail 50
          exit 1

      - name: Deploy app to web root
        env:
          PI_TARGET_DIR: /var/www/kanaanflow
        run: |
          sudo mkdir -p "${PI_TARGET_DIR}"
          # Readable by nginx whatever the runner user's umask is.
          sudo rsync -a --delete --timeout=30 --chmod=D755,F644 ./out/wwwroot/. "${PI_TARGET_DIR}/"

      - name: Install nginx site
        run: sudo install -m 644 deploy/nginx/kanaanflow.conf /etc/nginx/conf.d/kanaanflow.conf

      - name: Reload Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Install nightly database backup
        run: |
          sudo install -m 755 deploy/backup-db.sh /usr/local/bin/kanaanflow-backup
          sudo install -m 644 deploy/systemd/kanaanflow-backup.service deploy/systemd/kanaanflow-backup.timer /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable --now kanaanflow-backup.timer

      - name: Smoke test
        run: |
          # nginx reloads in the background, so give it a few seconds.
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null http://127.0.0.1:8081/ \
              && curl -fsS -o /dev/null http://127.0.0.1:8081/people \
              && curl -fsS -o /dev/null http://127.0.0.1:8081/service-worker.js \
              && curl -fsS -o /dev/null http://127.0.0.1:8081/api/health; then
              echo "KanaanFlow and its sync service are served on 127.0.0.1:8081"
              exit 0
            fi
            sleep 1
          done
          echo "::group::Diagnostics"
          curl -sS -i http://127.0.0.1:8081/ | head -15 || true
          curl -sS -i http://127.0.0.1:8081/api/health | head -15 || true
          echo "--- listening on 8081:"; sudo ss -ltnp | grep ':8081' || echo "nothing"
          echo "--- nginx includes:"; grep -n "include" /etc/nginx/nginx.conf || true
          echo "--- web root:"; sudo ls -la /var/www/kanaanflow | head -8
          echo "--- nginx error log:"; sudo tail -n 20 /var/log/nginx/error.log || true
          echo "::endgroup::"
          exit 1

      - name: Clean up old Docker images
        if: always()
        run: sudo docker image prune -f
